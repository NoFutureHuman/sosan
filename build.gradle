plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'sosang-workspace'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        resources {
            srcDirs = ['sosan-main/src/main/resources']
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'dev.langchain4j:langchain4j:0.35.0'
    // 2. OpenAI API 연동 라이브러리 (gpt-4o-mini 등 호출용)
    implementation 'dev.langchain4j:langchain4j-open-ai:0.35.0'
    // (선택) 로컬 메모리 기반 벡터 DB (RAG 구현 시 필요)
    implementation 'dev.langchain4j:langchain4j-easy-rag:0.35.0'
    implementation 'org.bsc.langgraph4j:langgraph4j-core:1.5.4'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}





tasks.named('test') {
    useJUnitPlatform()
}

// MySQL 연결 실패 시: .\gradlew.bat bootRun -Pdev (파일 H2, 재시작 후에도 데이터 유지)
// 설정 파일: sosan-main/src/main/resources/application.properties
tasks.named('bootRun') {
    if (project.hasProperty('dev')) {
        args '--spring.profiles.active=dev'
    }
}
