spring.application.name=sosang-workspace

# ===============================
# 1. OpenAI API Key — application-local.properties 또는 환경변수
# ===============================
openai.api.key=${OPENAI_API_KEY:}

# ===============================
# 2. 공공 데이터 API Keys
# ===============================
api.key.nts=${API_KEY_NTS:}
api.key.kamis=${API_KEY_KAMIS:}
api.key.smes=${API_KEY_SMES:}
api.key.molit=${API_KEY_MOLIT:}
api.key.semas=${API_KEY_SEMAS:}
api.key.reb=${API_KEY_REB:}

molit.api.key=${api.key.molit}
sbiz.api.key=${api.key.semas:}
rone.api.key=${api.key.reb}
smes.api.key=${api.key.smes}
nts.api.key=${api.key.nts}
kamis.api.key=${api.key.kamis}

# ===============================
# 3. MySQL Database Connection
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/sosang_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:classpath:application-local.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 4. JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

server.port=8081

app.auth.jwt.secret=${JWT_SECRET:sosang-workspace-jwt-secret-key-change-in-production-32bytes}
app.auth.jwt.expiration-ms=604800000

# 기존·신생 분석 모두 Java LangGraph4j (Spring 내부 처리)
