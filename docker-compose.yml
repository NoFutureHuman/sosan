services:
  mysql:
    image: mysql:8.0
    container_name: sosang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dbtmd
      MYSQL_DATABASE: sosang_db
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdbtmd"]
      interval: 5s
      timeout: 5s
      retries: 10
